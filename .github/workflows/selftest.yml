# Weekly self-test: live pages, the deck, the embed, and every cited source (links). Then keep the schedules alive.
name: Self-test

on:
  schedule:
    - cron: "29 6 * * 4"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  PJ_BASE_URL: ${{ vars.PJ_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tests on main
        run: python -m unittest discover -s tests -t .
      - name: Live game, embeds and source links
        run: python scripts/health.py "$PJ_BASE_URL"

  keepalive:
    needs: live
    if: always()
    uses: ./.github/workflows/keepalive.yml
